<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Brushed Gold Gradients -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d1"/>
      <stop offset="15%" stop-color="#f5d36e"/>
      <stop offset="35%" stop-color="#fff2b6"/>
      <stop offset="55%" stop-color="#d6a42f"/>
      <stop offset="75%" stop-color="#f3d069"/>
      <stop offset="90%" stop-color="#a67919"/>
      <stop offset="100%" stop-color="#6e4f0d"/>
    </linearGradient>

    <linearGradient id="goldHighlightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#936814"/>
      <stop offset="40%" stop-color="#fff5cc"/>
      <stop offset="70%" stop-color="#e2b442"/>
      <stop offset="100%" stop-color="#885e0e"/>
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff5c4"/>
      <stop offset="60%" stop-color="#f0c959"/>
      <stop offset="100%" stop-color="#b4831f"/>
    </linearGradient>

    <linearGradient id="goldClockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="40%" stop-color="#f5d26d"/>
      <stop offset="80%" stop-color="#c99726"/>
      <stop offset="100%" stop-color="#7a550d"/>
    </linearGradient>

    <!-- Vibrant Royal Navy Blue (NOT black, rich luminous blue like the original artwork) -->
    <radialGradient id="royalNavyGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#244b88"/>
      <stop offset="45%" stop-color="#19396b"/>
      <stop offset="80%" stop-color="#122a52"/>
      <stop offset="100%" stop-color="#0c1d3c"/>
    </radialGradient>

    <!-- Top Chambers Navy Gradient -->
    <linearGradient id="topNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#224782"/>
      <stop offset="100%" stop-color="#142c55"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#faf9f6" rx="88"/>

  <g transform="translate(71.68, 16) scale(0.72)">
    <!-- SHIELD DROP SHADOW (Clean solid shape shadow for universal compatibility) -->
    <path d="M 94,62 
             Q 256,36 418,62 
             L 418,228 
             Q 418,368 256,456 
             Q 94,368 94,228 
             Z" 
          fill="#000000" 
          opacity="0.22"
          transform="translate(0, 10)"/>
    <path d="M 94,62 
             Q 256,36 418,62 
             L 418,228 
             Q 418,368 256,456 
             Q 94,368 94,228 
             Z" 
          fill="#000000" 
          opacity="0.14"
          transform="translate(0, 5)"/>

    <!-- 1. SHIELD MAIN GOLD BORDER FRAME -->
    <path d="M 94,60 
             Q 256,34 418,60 
             L 418,226 
             Q 418,366 256,454 
             Q 94,366 94,226 
             Z" 
          fill="url(#goldBorderGrad)" 
          stroke="#5a3d07" 
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- 2. SHIELD BEVEL HIGHLIGHT INNER BORDER -->
    <path d="M 102,67 
             Q 256,43 410,67 
             L 410,225 
             Q 410,358 256,444 
             Q 102,358 102,225 
             Z" 
          fill="none" 
          stroke="url(#goldHighlightGrad)" 
          stroke-width="3"/>

    <!-- 3. SHIELD INTERIOR ROYAL NAVY BLUE FIELD -->
    <path d="M 107,72 
             Q 256,49 405,72 
             L 405,224 
             Q 405,350 256,434 
             Q 107,350 107,224 
             Z" 
          fill="url(#royalNavyGrad)" 
          stroke="#473106" 
          stroke-width="2"/>

    <!-- 4. GOLD DIVISION LINES (T-JUNCTION / CHEVRON) -->
    <!-- Shadow for division lines -->
    <g opacity="0.6">
      <line x1="256" y1="52" x2="256" y2="182" stroke="#081427" stroke-width="14" stroke-linecap="square"/>
      <line x1="256" y1="180" x2="106" y2="242" stroke="#081427" stroke-width="14" stroke-linecap="round"/>
      <line x1="256" y1="180" x2="406" y2="242" stroke="#081427" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Main Gold Division Beams -->
    <!-- Vertical center divider -->
    <path d="M 251,51 L 261,51 L 261,183 L 251,183 Z" fill="url(#goldBorderGrad)"/>
    <line x1="256" y1="51" x2="256" y2="183" stroke="#fffbe0" stroke-width="2"/>

    <!-- Diagonal Left divider -->
    <path d="M 256,174 L 261,185 L 109,247 L 105,236 Z" fill="url(#goldBorderGrad)"/>
    <line x1="256" y1="178" x2="107" y2="241" stroke="#fffbe0" stroke-width="1.8"/>

    <!-- Diagonal Right divider -->
    <path d="M 256,174 L 407,236 L 403,247 L 251,185 Z" fill="url(#goldBorderGrad)"/>
    <line x1="256" y1="178" x2="405" y2="241" stroke="#fffbe0" stroke-width="1.8"/>

    <!-- Center Junction Boss (Gold Diamond / Shield at junction) -->
    <polygon points="256,168 266,180 256,192 246,180" fill="url(#goldHighlightGrad)" stroke="#523908" stroke-width="1.5"/>

    <!-- ============================================== -->
    <!-- TOP-LEFT COMPARTMENT: "쌤" (Bold Embossed Gold) -->
    <!-- ============================================== -->
    <g>
      <!-- Deep 3D Shadow -->
      <text x="183" y="141" 
            text-anchor="middle" 
            dominant-baseline="central" 
            font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
            font-size="64" 
            font-weight="900" 
            fill="#091427"
            stroke="#091427"
            stroke-width="5"
            letter-spacing="-1">쌤</text>
      <!-- Warm Gold Shadow -->
      <text x="182" y="139" 
            text-anchor="middle" 
            dominant-baseline="central" 
            font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
            font-size="64" 
            font-weight="900" 
            fill="#5a3d07"
            stroke="#5a3d07"
            stroke-width="3"
            letter-spacing="-1">쌤</text>
      <!-- Brilliant Metallic Gold Front Face -->
      <text x="180" y="136" 
            text-anchor="middle" 
            dominant-baseline="central" 
            font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
            font-size="64" 
            font-weight="900" 
            fill="url(#goldTextGrad)"
            stroke="#7a550d"
            stroke-width="1.5"
            letter-spacing="-1">쌤</text>
    </g>

    <!-- ============================================== -->
    <!-- TOP-RIGHT COMPARTMENT: "타임" (Bold Embossed Gold) -->
    <!-- ============================================== -->
    <g>
      <!-- Deep 3D Shadow -->
      <text x="335" y="141" 
            text-anchor="middle" 
            dominant-baseline="central" 
            font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
            font-size="56" 
            font-weight="900" 
            fill="#091427"
            stroke="#091427"
            stroke-width="5"
            letter-spacing="-2">타임</text>
      <!-- Warm Gold Shadow -->
      <text x="334" y="139" 
            text-anchor="middle" 
            dominant-baseline="central" 
            font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
            font-size="56" 
            font-weight="900" 
            fill="#5a3d07"
            stroke="#5a3d07"
            stroke-width="3"
            letter-spacing="-2">타임</text>
      <!-- Brilliant Metallic Gold Front Face -->
      <text x="332" y="136" 
            text-anchor="middle" 
            dominant-baseline="central" 
            font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
            font-size="56" 
            font-weight="900" 
            fill="url(#goldTextGrad)"
            stroke="#7a550d"
            stroke-width="1.5"
            letter-spacing="-2">타임</text>
    </g>

    <!-- ============================================== -->
    <!-- BOTTOM COMPARTMENT: LUXURY GOLD CLOCK (10:00)   -->
    <!-- Center: (256, 316), Radius: 78                  -->
    <!-- ============================================== -->
    <g id="clockDial">
      <!-- Outer Subtle Dial Glow Ring -->
      <circle cx="256" cy="316" r="88" fill="none" stroke="#2c5396" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

      <!-- 12 Gold Hour Ticks (Radius: 78) -->
      <!-- 12 o'clock (Top, bold primary) -->
      <rect x="253.5" y="235" width="5" height="16" rx="2.5" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="1"/>
      <rect x="254.5" y="236" width="3" height="14" rx="1.5" fill="#fffbe6"/>

      <!-- 1 o'clock (30°) -->
      <g transform="rotate(30, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>
      <!-- 2 o'clock (60°) -->
      <g transform="rotate(60, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>

      <!-- 3 o'clock (90°, bold primary) -->
      <g transform="rotate(90, 256, 316)">
        <rect x="253.5" y="235" width="5" height="16" rx="2.5" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="1"/>
        <rect x="254.5" y="236" width="3" height="14" rx="1.5" fill="#fffbe6"/>
      </g>

      <!-- 4 o'clock (120°) -->
      <g transform="rotate(120, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>
      <!-- 5 o'clock (150°) -->
      <g transform="rotate(150, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>

      <!-- 6 o'clock (180°, bold primary) -->
      <g transform="rotate(180, 256, 316)">
        <rect x="253.5" y="235" width="5" height="16" rx="2.5" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="1"/>
        <rect x="254.5" y="236" width="3" height="14" rx="1.5" fill="#fffbe6"/>
      </g>

      <!-- 7 o'clock (210°) -->
      <g transform="rotate(210, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>
      <!-- 8 o'clock (240°) -->
      <g transform="rotate(240, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>

      <!-- 9 o'clock (270°, bold primary) -->
      <g transform="rotate(270, 256, 316)">
        <rect x="253.5" y="235" width="5" height="16" rx="2.5" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="1"/>
        <rect x="254.5" y="236" width="3" height="14" rx="1.5" fill="#fffbe6"/>
      </g>

      <!-- 10 o'clock (300°) -->
      <g transform="rotate(300, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>
      <!-- 11 o'clock (330°) -->
      <g transform="rotate(330, 256, 316)">
        <rect x="254" y="237" width="4" height="12" rx="2" fill="url(#goldClockGrad)" stroke="#523807" stroke-width="0.8"/>
      </g>

      <!-- ============================== -->
      <!-- CLOCK HANDS (Indicating 10:00) -->
      <!-- ============================== -->
      <!-- Hand Shadows -->
      <!-- Minute hand shadow (0°, straight up) -->
      <path d="M 255,318 L 256,252 Q 257.5,249 259,252 L 260,318 Z" fill="#081427" opacity="0.7"/>
      <!-- Hour hand shadow (-60°, 10 o'clock) -->
      <g transform="rotate(-60, 256, 316)">
        <path d="M 254,319 L 255.5,268 Q 257.5,265 259.5,268 L 261,319 Z" fill="#081427" opacity="0.7"/>
      </g>

      <!-- Minute Hand (Straight UP to 12:00, Length: 66px, Width: 6px) -->
      <g>
        <path d="M 253,316 L 254.5,250 Q 256,246 257.5,250 L 259,316 Z" 
              fill="url(#goldClockGrad)" 
              stroke="#593b07" 
              stroke-width="1.2"/>
        <line x1="256" y1="252" x2="256" y2="315" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
      </g>

      <!-- Hour Hand (Pointing to 10:00, -60°, Length: 48px, Width: 8px) -->
      <g transform="rotate(-60, 256, 316)">
        <path d="M 252,316 L 254,268 Q 256,264 258,268 L 260,316 Z" 
              fill="url(#goldClockGrad)" 
              stroke="#593b07" 
              stroke-width="1.2"/>
        <line x1="256" y1="270" x2="256" y2="315" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
      </g>

      <!-- Center Pinion Hub (Multi-layered Gold Cap) -->
      <circle cx="256" cy="316" r="11" fill="#091427" opacity="0.6"/>
      <circle cx="256" cy="316" r="9.5" fill="url(#goldBorderGrad)" stroke="#523908" stroke-width="1.5"/>
      <circle cx="256" cy="316" r="5" fill="#fff7d6" stroke="#996f18" stroke-width="1"/>
      <circle cx="256" cy="316" r="2.2" fill="#543a08"/>
    </g>
  </g>

  
  <!-- TITLE & SUBTITLE MATCHING 22_쌤타임.jpg -->
  <g transform="translate(0, 10)">
    <!-- Primary Title: 쌤타임 (Large Embossed Gold) -->
    <text x="258" y="445" 
          text-anchor="middle" 
          font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="#47320a" 
          stroke="#47320a"
          stroke-width="3"
          letter-spacing="2">쌤타임</text>
    <text x="256" y="443" 
          text-anchor="middle" 
          font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="url(#goldTextGrad)" 
          stroke="#684a0d"
          stroke-width="1.5"
          letter-spacing="2">쌤타임</text>

    <!-- Subtitle: 실시간 수업시간표 조회 시스템 -->
    <text x="256" y="475" 
          text-anchor="middle" 
          font-family="'Noto Sans CJK KR', 'Noto Sans KR', sans-serif" 
          font-size="20" 
          font-weight="800" 
          fill="#1b2e50" 
          letter-spacing="0.5">실시간 수업시간표 조회 시스템</text>
  </g>
</svg>